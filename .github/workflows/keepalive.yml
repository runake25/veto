# Keeps the free hosted demo warm.
#
# The demo runs on a free Hugging Face Docker Space. Free CPU Spaces sleep after a
# long idle window (and a restart loses the ephemeral filesystem, so a judging
# session's history would reset). This scheduled ping counts as a visit and keeps
# the Space awake around the clock at no cost.
#
# Set the repository variable VETO_URL to the public origin, e.g.
#   gh variable set VETO_URL --body "https://<owner>-veto.hf.space"
#
# Retries because the first ping after a sleep has to wait for the container to boot.

name: keep-alive

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the hosted demo
        env:
          VETO_URL: ${{ vars.VETO_URL }}
        run: |
          if [ -z "${VETO_URL}" ]; then
            echo "::error::VETO_URL repository variable is not set"
            exit 1
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${VETO_URL}/api/health" || true)
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::the hosted demo did not answer /api/health"
          exit 1
