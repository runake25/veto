# Keeps the free hosted demo warm.
#
# The demo runs on Render's free web-service plan. A free instance spins down after
# 15 minutes without inbound traffic, and a spun-down instance loses its ephemeral
# filesystem (so a judging session's demo history would reset). This scheduled ping
# counts as traffic and keeps the instance running around the clock at no cost.
#
# Set the repository variable VETO_URL to the public origin, e.g.
#   gh variable set VETO_URL --body "https://veto-bracken-field.onrender.com"
#
# Retries because the first ping after a sleep has to wait for the container to boot.

name: keep-alive

on:
  schedule:
    # GitHub only registers schedules for workflows on the default branch. The
    # repository's default branch moved to v2 on 2026-10-26; this file was
    # re-touched so the scheduler registers it again.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the hosted demo
        env:
          VETO_URL: ${{ vars.VETO_URL }}
        run: |
          if [ -z "${VETO_URL}" ]; then
            echo "::error::VETO_URL repository variable is not set"
            exit 1
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${VETO_URL}/api/health" || true)
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::the hosted demo did not answer /api/health"
          exit 1
