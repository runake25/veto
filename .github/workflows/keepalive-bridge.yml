# Keeps the free Render demo awake when GitHub's cron scheduler is slow.
#
# A free Render web service sleeps after 15 idle minutes, so the "no sleep for
# judging week" guarantee cannot depend on one registration. This workflow is a
# self-renewing bridge: it pings /api/health every four minutes for ~5.5 hours
# and, before its window closes, dispatches the next window with the workflow
# token. Each window is under GitHub's six-hour job limit, and Actions minutes
# are free for a public repository — so the chain can run indefinitely at $0.
#
# It coexists with the ordinary `*/5` scheduled workflow (keepalive.yml): if the
# cron registers, that is the permanent pinger; if not, the bridge carries the
# demo. The job also tries a `keepalive.yml` dispatch at renewal as a nudge.
#
# Dispatch the chain with:
#   gh workflow run keepalive-bridge.yml --repo runake25/veto --ref v2

name: keep-alive-bridge

on:
  workflow_dispatch:

permissions:
  actions: write # the renewal step dispatches the next bridge window

concurrency:
  group: keep-alive-bridge-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  keep-warm:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping the hosted demo and renew the window
        env:
          VETO_URL: ${{ vars.VETO_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "${VETO_URL}" ]; then
            echo "::error::VETO_URL repository variable is not set"
            exit 1
          fi
          start=$(date +%s)
          renew_at=$(( start + 290 * 60 ))
          end=$(( start + 330 * 60 ))
          renewed=0
          echo "keeping ${VETO_URL} warm until $(date -u -d "@$end" +%H:%M:%SZ)"
          while [ "$(date +%s)" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${VETO_URL}/api/health" || true)
            echo "$(date -u +%H:%M:%SZ) /api/health -> ${code}"
            now=$(date +%s)
            if [ "$now" -ge "$renew_at" ] && [ "$renewed" -eq 0 ]; then
              if gh workflow run keepalive-bridge.yml --repo "$REPO" --ref "$REF"; then
                echo "::notice::next keep-alive window dispatched"
                renewed=1
              else
                echo "::warning::renewal dispatch failed; retrying on the next ping"
              fi
              gh workflow run keepalive.yml --repo "$REPO" --ref "$REF" \
                && echo "scheduled keepalive nudged" \
                || true
            fi
            sleep 240
          done
          if [ "$renewed" -eq 0 ]; then
            echo "::error::this window never managed to dispatch its successor"
            exit 1
          fi
          echo "window handed over"
