# Paste this into api.slack.com/apps → Create New App → From an app manifest.
# Replace the two https://… placeholders with your public tunnel URL, then
# install the app to your workspace and copy the two secrets into .env.
display_information:
  name: Veto
  description: Every purchase an agent proposes has to pass the team's spending charter. Over the line? A human signs first.
  background_color: "#17191b"
features:
  bot_user:
    display_name: Veto
    always_online: true
  slash_commands:
    - command: /veto
      url: https://REPLACE-ME.ngrok-free.app/api/slack/veto
      description: Order supplies through the team's spending rules.
      usage_hint: what to buy — e.g. 2 packs of toilet paper
      should_escape: false
    - command: /veto-check
      url: https://REPLACE-ME.ngrok-free.app/api/slack/veto
      description: Show the top five matches so you can pick one or refine.
      usage_hint: what to look for — e.g. paper towels
      should_escape: false
    - command: /veto-status
      url: https://REPLACE-ME.ngrok-free.app/api/slack/veto
      description: Show what is waiting for a signature.
      usage_hint: "[agent] — leave empty for everything"
      should_escape: false
    - command: /veto-budget
      url: https://REPLACE-ME.ngrok-free.app/api/slack/veto
      description: "Show this month's money: settled, waiting, left."
      usage_hint: "[agent] — leave empty for the whole workspace"
      should_escape: false
    - command: /veto-routines
      url: https://REPLACE-ME.ngrok-free.app/api/slack/veto
      description: Show the agents' standing jobs and when they run next.
      usage_hint: "[agent] — leave empty for every routine"
      should_escape: false
    - command: /veto-help
      url: https://REPLACE-ME.ngrok-free.app/api/slack/veto
      description: Show what Veto can do from Slack.
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
settings:
  interactivity:
    is_enabled: true
    request_url: https://REPLACE-ME.ngrok-free.app/api/slack/interact
  org_deploy_enabled: false
  socket_mode_enabled: false
